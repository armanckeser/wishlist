# Wishlist for anyone self-hosting it. One command, no clone:
#
#   docker compose -f oci://ghcr.io/armanckeser/wishlist-stack:latest up -d
#
# (Compose 2.34+; or download this file and run `docker compose -f docker-compose.selfhost.yml up -d`.)
# Then open http://<host>:8080 and sign up: the first account is yours. Migrations and keys are set up on
# first start; there is nothing to run by hand. One container instead of two: `ghcr.io/armanckeser/wishlist:aio`.
#
# Only the app publishes a port. The store packages (armanckeser/selfhost-apps) are generated from this
# shape, so keep it free of bind mounts, env_file and build:.

name: wishlist

services:
  app:
    image: ghcr.io/armanckeser/wishlist:${TAG:-latest}
    restart: unless-stopped
    # Long syntax: Compose 5 `publish` rejects a short "${PORT}:8080" string.
    ports:
      - target: 8080
        published: "${PORT:-8080}"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wishlist}
      # The address you open Wishlist at; links in emails and shared lists point there.
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:8080}
      # Optional: an account created on first start. Without it, sign up from the login page.
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      # Optional: email for password resets and notifications.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-True}
      SMTP_SSL: ${SMTP_SSL:-False}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      # Optional: package tracking through 17track.
      SEVENTEENTRACK_SECURITY_KEY: ${SEVENTEENTRACK_SECURITY_KEY:-}
      # Optional: a FlareSolverr-compatible browser for stores that serve a JavaScript challenge
      # (e.g. http://flaresolverr:8191/v1). Most stores work without it.
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      # Postgres is never published, so the default is only reachable from this stack. Set DB_PASSWORD
      # before the FIRST start to use your own.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wishlist}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata

volumes:
  pgdata:
