[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = "==3.12.7"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    # Pinned ahead of what fastapi[standard] requires: uvicorn only grew a
    # startup grace period for workers in 0.52. Before that its multiprocess
    # supervisor SIGKILLed any worker that had not answered a health-check
    # ping within 5s of spawn, which a cold-cache import on the self-hosted
    # box regularly missed -- the "Child process [N] died" restart loop.
    "uvicorn[standard]>=0.52.0",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "alembic-postgresql-enum>=1.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    "bcrypt>=4.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    "extruct>=0.18.0",
    "curl-cffi>=0.14.0",
    "pywebpush>=2.0.0",
    "tracking-numbers>=0.1.8",
    "apscheduler>=3.10.0",
    "aiolimiter>=1.1.0",
    "cachebox>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "coverage<8.0.0,>=7.4.3",
    "ty>=0.0.11",
    "pandas>=2.0.0",
    "ipykernel>=6.0.0",
    "pytest-cov>=6.3.0",
    "slipcover>=1.0.17",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
]

[project.scripts]
wishlist-cli = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty.environment]
python-version = "3.12"
python = ".venv"

[tool.ty.src]
exclude = ["**/venv/**", "**/.venv/**", "**/alembic/**"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]  # Allow print in scripts
"notebooks/*.py" = ["T201"]  # Allow print in notebooks
"tests/**/*.py" = ["ARG001"]  # Allow unused fixture dependencies in tests

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit real external sites (deselect with '-m \"not integration\"')",
]
