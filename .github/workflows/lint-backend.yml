name: Lint Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # uv installs the exact Python pyproject.toml pins (3.12.7).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.11"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run bash scripts/lint.sh
        working-directory: backend
