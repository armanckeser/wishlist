name: Generate Client

# The frontend's API client (frontend/src/client) is generated from the backend's OpenAPI schema. This
# fails when a backend change was committed without regenerating it: run scripts/generate-client.sh.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.11"
          enable-cache: true
      - run: npm ci
        working-directory: frontend
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run bash scripts/generate-client.sh
        env:
          VIRTUAL_ENV: backend/.venv
          PROJECT_NAME: wishlist
          POSTGRES_SERVER: localhost
          POSTGRES_USER: postgres
      - name: The committed client matches
        run: |
          git add -N frontend/src/client
          git diff --exit-code -- frontend/src/client \
            || (echo "frontend/src/client is out of date: run scripts/generate-client.sh and commit it" && exit 1)
